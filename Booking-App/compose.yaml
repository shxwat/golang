services:
  db:
    # Pin the major version so a future PostgreSQL upgrade cannot break the volume.
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: bookingapp
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bookingapp"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DB_USER: postgres
      DB_PASSWORD: root
      DB_NAME: bookingapp
      DB_HOST: db
      DB_PORT: 5432
      PORT: 8080
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
